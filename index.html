<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Менеджер задач</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .task {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .task.done {
                opacity: 0.5;
                text-decoration: line-through;
            }

        .task-text { /* поменяла, чтобы было более красиво */
            flex: 40;
            word-break: break-word;
            line-height: 1.4;
            cursor: pointer;
        }

        .stats {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>
    <h1>Менеджер задач</h1>

    <div class="input-row">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button id="addBtn">Добавить</button>
    </div>


    <div id="tasksList"></div>
    <div class="stats" id="stats"></div>

    <script>
        function createTaskManager() {
            let tasks = [];

            function generateId() {
                return Date.now() + Math.random();
            }

            return {
                addTask(text) {
                    if (!text || text.trim() === '') return;

                    const task = {
                        id: generateId(),
                        text: text.trim(),
                        done: false
                    };
                    tasks.push(task);
                    return task;
                },

                removeTask(id) {
                    tasks = tasks.filter(task => task.id !== id);
                },

                toggleTask(id) {
                    const task = tasks.find(task => task.id === id);
                    if (task) {
                        task.done = !task.done;
                    }
                },

                getAll() {
                    return [...tasks];
                },

                getStats() {
                    const total = tasks.length;
                    const active = tasks.filter(task => !task.done).length;
                    const completed = tasks.filter(task => task.done).length;

                    return { total, active, completed };
                }
            };
        }

        const app = {
            manager: createTaskManager(),

            init() {
                this.addBtn = document.getElementById('addBtn');
                this.taskInput = document.getElementById('taskInput');
                this.tasksList = document.getElementById('tasksList');
                this.statsEl = document.getElementById('stats');

                this.addBtn.addEventListener('click', () => {
                    this.addTaskHandler();
                });

                this.taskInput.addEventListener('keypress', (e) => { //доп: "При нажатии Enter в поле — задача добавляется (без клика на кнопку)"
                    if (e.key === 'Enter') {
                        this.addTaskHandler();
                    }
                });

                this.loadFromStorage(); //доп: "дохранение в localStorage (после перезагрузки страницы задачи остаются)"

                this.render();
            },

            addTaskHandler() {
                const text = this.taskInput.value;

                if (!text || text.trim() === '') { //доп: "Нельзя добавить пустую задачу"
                    return;
                }

                this.manager.addTask(text);
                this.taskInput.value = '';
                this.saveToStorage();
                this.render();
            },

            render() {
                this.tasksList.innerHTML = '';
                const tasks = this.manager.getAll();

                tasks.forEach(task => {
                    const taskDiv = this.createTaskElement(task);
                    this.tasksList.appendChild(taskDiv);
                });

                this.updateStats();
            },

            createTaskElement(task) {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task';
                if (task.done) {
                    taskDiv.classList.add('done');
                }

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.done;

                checkbox.addEventListener('change', () => {
                    this.manager.toggleTask(task.id);
                    this.saveToStorage();
                    this.render();
                });

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.text;

                textSpan.addEventListener('click', () => {
                    this.manager.toggleTask(task.id);
                    this.saveToStorage();
                    this.render();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'x';

                deleteBtn.addEventListener('click', () => {
                    this.manager.removeTask(task.id);
                    this.saveToStorage();
                    this.render();
                });

                taskDiv.appendChild(checkbox);
                taskDiv.appendChild(textSpan);
                taskDiv.appendChild(deleteBtn);

                return taskDiv;
            },

            updateStats() {
                const stats = this.manager.getStats();
                this.statsEl.innerHTML = `
                    Всего: ${stats.total} |
                    Активных: ${stats.active} |
                    Выполненных: ${stats.completed}
        `;
            },

            saveToStorage() {
                const tasks = this.manager.getAll();
                localStorage.setItem('todo-tasks', JSON.stringify(tasks));
            },

            loadFromStorage() {
                const saved = localStorage.getItem('todo-tasks');
                if (saved) {
                    const tasks = JSON.parse(saved);
                    tasks.forEach(task => {
                        const newTask = this.manager.addTask(task.text);
                        if (task.done && newTask) {
                            this.manager.toggleTask(newTask.id);
                        }
                    });
                }
            }
        };

        app.init();
    </script>
</body>
</html>
