<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Cards</title>
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        const container = document.getElementById('app');

        fetch('https://jsonplaceholder.typicode.com/users')
            .then(response => response.json())
            .then(users => {
                container.innerHTML = '';

                users.forEach(user => {
                    container.innerHTML += `
                            <div style="border: 1px solid #ccc; padding: 10px; margin: 10px; width: 250px; display: inline-block; vertical-align: top;">
                                <strong>${user.name}</strong><br>
                                City: ${user.address.city}<br>
                                Email: ${user.email}
                            </div>
                        `;
                });
            })
            .catch(error => {
                container.innerHTML = `Error: ${error.message}`;
            });
    </script>
</body>
</html>
